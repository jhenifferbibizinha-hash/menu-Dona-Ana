<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dona Ana Confeitaria</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

/* topo */
header {
  background: #e88b94;
  color: white;
  text-align: center;
  padding: 18px;
  font-size: 20px;
  font-weight: bold;
}

/* container */
.container {
  max-width: 600px;
  margin: auto;
  padding: 15px;
}

/* cada cardápio */
.cardapio {
  background: white;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  overflow: hidden;
}

.cardapio h2 {
  margin: 0;
  padding: 12px;
  background: #f2c1c6;
  text-align: center;
  font-size: 18px;
}

.cardapio img {
  width: 100%;
  display: block;
}

/* rodapé */
footer {
  text-align: center;
  padding: 15px;
  font-size: 14px;
  color: #555;
}
</style>
</head>

<body>

<header>
  🍰 Dona Ana Confeitaria
</header>

<div class="container">

  <div class="cardapio">
    <h2>🍰 Cardápio de Doces</h2>
    <img src="doces.jpg" alt="Cardápio de doces">
  </div>

  <div class="cardapio">
    <h2>🍨 Cardápio de Sorvetes</h2>
    <img src="sorvetes.jpg" alt="Cardápio de sorvetes">
  </div>

</div>

<footer>
  📱 (19) 97420-2350 <br>
  📸 @donaanadocesebolos
</footer>

</body>
</html>
