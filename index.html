<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dona Ana Confeitaria</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #fff5f6;
}

header {
  background: #e88b94;
  color: white;
  text-align: center;
  padding: 15px;
  font-size: 20px;
  font-weight: bold;
}

.container {
  padding: 15px;
  max-width: 650px;
  margin: auto;
  padding-bottom: 140px;
}

h2 {
  color: #e88b94;
  margin-top: 25px;
}

.item {
  background: white;
  margin-bottom: 10px;
  padding: 12px;
  border-radius: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

button {
  background: #e88b94;
  border: none;
  color: white;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
}

.cart {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: white;
  border-top: 2px solid #ccc;
  padding: 10px;
}

.cart input {
  width: 100%;
  padding: 8px;
  margin-bottom: 5px;
}

.cart button {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  background: #25d366;
  color: white;
  border: none;
  border-radius: 6px;
}
</style>
</head>

<body>

<header>
🍰 Dona Ana Confeitaria
</header>

<div class="container" id="menu"></div>

<div class="cart">
  <input type="text" id="nome" placeholder="Seu nome">
  <div id="total">Total: R$ 0,00</div>
  <button onclick="finalizarPedido()">Finalizar Pedido</button>
</div>

<script>

const produtos = [

/* 🍰 TORTAS */
{nome:"Limão", preco:25, cat:"🍰 Tortas"},
{nome:"Maracujá c/ Chocolate", preco:25, cat:"🍰 Tortas"},
{nome:"Banoffe", preco:25, cat:"🍰 Tortas"},
{nome:"Ninho c/ Uva Verde", preco:25, cat:"🍰 Tortas"},
{nome:"Rafaello", preco:25, cat:"🍰 Tortas"},
{nome:"Ferrero Rocher", preco:25, cat:"🍰 Tortas"},
{nome:"Napolitano", preco:25, cat:"🍰 Tortas"},
{nome:"Kinder Bueno", preco:25, cat:"🍰 Tortas"},
{nome:"Choco Óreo", preco:25, cat:"🍰 Tortas"},
{nome:"Bombom de Morango", preco:25, cat:"🍰 Tortas"},
{nome:"Pink Lemonade", preco:25, cat:"🍰 Tortas"},
{nome:"Doce de leite crocante", preco:25, cat:"🍰 Tortas"},
{nome:"Pistache c/ frutas vermelhas", preco:25, cat:"🍰 Tortas"},

/* 🎂 CASEIRINHOS */
{nome:"Duo chocolate", preco:28, cat:"🎂 Bolos"},
{nome:"Chocolate", preco:28, cat:"🎂 Bolos"},
{nome:"Cenoura c/ chocolate", preco:28, cat:"🎂 Bolos"},

/* 🍫 BROWNIES */
{nome:"Doce de leite", preco:15, cat:"🍫 Brownies"},
{nome:"Brigadeiro", preco:15, cat:"🍫 Brownies"},
{nome:"Duo chocolate", preco:15, cat:"🍫 Brownies"},
{nome:"Tradicional", preco:13, cat:"🍫 Brownies"},

/* 🍨 SORVETES TRADICIONAIS */
{nome:"Coco", preco:15, cat:"🍨 Sorvetes Tradicionais"},
{nome:"Abacaxi", preco:15, cat:"🍨 Sorvetes Tradicionais"},
{nome:"Limão", preco:15, cat:"🍨 Sorvetes Tradicionais"},
{nome:"Morango", preco:15, cat:"🍨 Sorvetes Tradicionais"},
{nome:"Maracujá", preco:15, cat:"🍨 Sorvetes Tradicionais"},
{nome:"Leite condensado", preco:15, cat:"🍨 Sorvetes Tradicionais"},
{nome:"Doce de leite", preco:15, cat:"🍨 Sorvetes Tradicionais"},

/* 🍦 SORVETES GOURMET */
{nome:"Nutella", preco:18, cat:"🍦 Sorvetes Gourmet"},
{nome:"Ninho c/ Nutella", preco:18, cat:"🍦 Sorvetes Gourmet"},
{nome:"Ovomaltine", preco:18, cat:"🍦 Sorvetes Gourmet"},
{nome:"Pistache", preco:18, cat:"🍦 Sorvetes Gourmet"},
{nome:"Maracujá c/ chocolate", preco:18, cat:"🍦 Sorvetes Gourmet"},
{nome:"Morango c/ chocolate", preco:18, cat:"🍦 Sorvetes Gourmet"},
{nome:"Ninho c/ morango", preco:18, cat:"🍦 Sorvetes Gourmet"}

];

let carrinho = {};
const menu = document.getElementById("menu");

const categorias = [...new Set(produtos.map(p => p.cat))];

let html = "";

categorias.forEach(cat => {
  html += `<h2>${cat}</h2>`;

  produtos.filter(p => p.cat === cat).forEach((p, index) => {
    const id = cat + "-" + index;

    html += `
      <div class="item">
        <span>${p.nome} - R$ ${p.preco}</span>
        <div class="controls">
          <button onclick="remover('${id}')">-</button>
          <span id="${id}">0</span>
          <button onclick="adicionar('${id}', ${p.preco}, '${p.nome}')">+</button>
        </div>
      </div>
    `;
  });
});

menu.innerHTML = html;

function adicionar(id, preco, nome) {
  if (!carrinho[id]) carrinho[id] = {qtd:0, preco, nome};
  carrinho[id].qtd++;
  document.getElementById(id).innerText = carrinho[id].qtd;
  atualizar();
}

function remover(id) {
  if (!carrinho[id]) return;
  carrinho[id].qtd--;
  if (carrinho[id].qtd <= 0) delete carrinho[id];
  document.getElementById(id).innerText = carrinho[id]?.qtd || 0;
  atualizar();
}

function atualizar() {
  let total = 0;
  for (let i in carrinho) {
    total += carrinho[i].qtd * carrinho[i].preco;
  }

  document.getElementById("total").innerText =
    "Total: R$ " + total.toFixed(2).replace(".", ",");
}

function finalizarPedido() {
  const nome = document.getElementById("nome").value.trim() || "Cliente";

  if (Object.keys(carrinho).length === 0) {
    alert("Carrinho vazio!");
    return;
  }

  let msg = `Pedido - ${nome}:\n`;
  let total = 0;

  for (let i in carrinho) {
    msg += `${carrinho[i].qtd}x ${carrinho[i].nome}\n`;
    total += carrinho[i].qtd * carrinho[i].preco;
  }

  msg += `\nTotal: R$ ${total.toFixed(2)}`;

  window.open("https://wa.me/5519974202350?text=" + encodeURIComponent(msg));
}
</script>

</body>
</html>
